name: Build User Objects

# Builds both component sets so nobody needs a local IronPython or GH_IO.dll.
# Download them from the run's Artifacts, or from the Release assets when a
# tag is pushed.
#
#   sunlight-ghuser-rhino7  IronPython 2.7 components for Rhino 7
#   sunlight-ghuser-rhino8  Python 3 components for Rhino 8
#
# Install only the set matching your Rhino version.

on:
  push:
    branches: [main]
    paths:
      - "src/ghuser/**"
      - "src/rhino7/**"
      - "src/rhino8/**"
      - "tools/**"
      - ".github/workflows/build-ghuser.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "src/ghuser/**"
      - "src/rhino7/**"
      - "src/rhino8/**"
      - "tools/**"
  workflow_dispatch:

jobs:
  validate:
    name: Validate bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The bundles are generated from src/rhino7, src/rhino8 and
      # tools/ghuser_spec.py. Fail loudly if someone edited a script or a port
      # without regenerating, so a User Object can never ship an algorithm or
      # a port list the project did not verify.
      - name: Check generated bundles are in sync
        run: python3 tools/build_ghuser_bundles.py --check

      # Catches what the componentizer would either reject, or accept and then
      # fail on at run time inside Grasshopper.
      - name: Validate bundle metadata
        run: python3 tools/check_ghuser_bundle.py

  build:
    name: Build ${{ matrix.flavour }}
    needs: validate
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: rhino7
            interpreter: ironpython
          - flavour: rhino8
            interpreter: cpython
    steps:
      - uses: actions/checkout@v4

      # 2.7.8.1 is the version the componentizer documents. 2.7.9 and 2.7.11
      # are known to misbehave against the Rhino 6 SDK the IronPython build
      # targets. The cpython flavour ignores this but installing it is
      # harmless and keeps the matrix uniform.
      - name: Install IronPython
        if: matrix.interpreter == 'ironpython'
        run: choco install ironpython --version=2.7.8.1 -y

      # componentize_cpy.py drives GH_IO.dll through pythonnet. The action
      # does not install it, so the cpython leg fails with "No module named
      # 'clr'" without this.
      - name: Install pythonnet
        if: matrix.interpreter == 'cpython'
        run: python -m pip install --upgrade pip pythonnet

      # componentize_cpy.py writes into the target directory but does not
      # create it, unlike the IronPython variant.
      - name: Create target directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path dist/ghuser/${{ matrix.flavour }}

      - name: Componentize
        uses: compas-dev/compas-actions.ghpython_components@v5
        with:
          source: src/ghuser/${{ matrix.flavour }}
          target: dist/ghuser/${{ matrix.flavour }}
          interpreter: ${{ matrix.interpreter }}

      - name: List build output
        shell: pwsh
        run: Get-ChildItem -Recurse dist/ghuser/${{ matrix.flavour }}

      - uses: actions/upload-artifact@v4
        with:
          name: sunlight-ghuser-${{ matrix.flavour }}
          path: dist/ghuser/${{ matrix.flavour }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ghuser/${{ matrix.flavour }}/*.ghuser
